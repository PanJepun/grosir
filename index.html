<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PANJEPUN STORE - Login</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;height:100dvh}
body{margin:0;font-family:'Segoe UI',Arial;background:#0a1629;display:flex;justify-content:center;align-items:center;padding:10px;overflow:hidden}
.login-box{background:#12233a;width:100%;max-width:400px;border-radius:16px;padding:16px 18px;box-shadow:0 10px 30px rgba(0,0,0,0.5);border:1px solid #1e3a5f;max-height:100dvh;display:flex;flex-direction:column;justify-content:center}
.logo{text-align:center;color:#ff7a00;font-size:22px;font-weight:900;margin:0;line-height:1.1}
.sub{text-align:center;color:#94a3b8;font-size:11px;margin:4px 0 8px 0}
label{color:#cbd5e1;font-size:10px;font-weight:700;display:block;margin:8px 0 4px 0}
select,input{width:100%;padding:10px 12px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:white;font-size:13px;outline:none}
select:focus,input:focus{border-color:#ff7a00}
.btn-orange{background:#ff7a00;color:white;border:none;padding:11px;width:100%;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;margin-top:10px}
.btn-ungu{background:#8b5cf6;color:white;border:none;padding:11px;width:100%;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;margin-top:8px}
.btn-kecil{background:#334155;color:white;border:none;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;margin-top:5px}
.divider{display:flex;align-items:center;gap:8px;color:#64748b;font-size:10px;margin:10px 0 0 0}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:#334155}
#status{font-size:11px;text-align:center;margin-top:6px;font-weight:700;line-height:1.3}
@media (max-height:600px){
  .logo{font-size:19px}
  .sub{margin:2px 0 4px}
  label{margin:6px 0 3px}
  select,input{padding:8px 10px}
  .btn-orange,.btn-ungu{padding:9px}
  .login-box{padding:12px 16px}
}
</style>
</head>
<body>
<div class="login-box">
  <p class="logo">🏪 PANJEPUN STORE</p>
  <p class="sub">Sistem Toko - Local, Tanpa Internet Beb</p>
  <p id="status" style="color:#fbbf24;">⏳ Memuat daftar user...</p>
  <label>PILIH USER</label>
  <select id="pilihUser"><option value="">-- Pilih Nama Anda --</option></select>
  <label>PASSWORD</label>
  <input type="password" id="passwordUser" placeholder="Masukkan Password" onkeydown="if(event.key==='Enter') loginUser()">
  <button class="btn-orange" onclick="loginUser()">➡️ LOGIN</button>
  <div class="divider">ATAU MASTER KEY</div>
  <label>MASTER KEY</label>
  <input type="password" id="masterKey" placeholder="Masukkan Master Key" autocomplete="off">
  <label>PASSWORD</label>
  <input type="password" id="passwordMaster" placeholder="Masukkan Password" autocomplete="off" onkeydown="if(event.key==='Enter') loginMaster()">
  <button class="btn-kecil" onclick="lihatPass()">👁️ Lihat Password</button>
  <button class="btn-ungu" onclick="loginMaster()">👑 LOGIN MASTER KEY</button>
  <p style="text-align:center;color:#64748b;font-size:11px;margin:8px 0 0">User dibuat di Tools -> <a href="tools.html" style="color:#ff7a00;">Buka Tools</a> | <a href="user.html" style="color:#ff7a00;">Kelola User</a></p>
  <p id="debugLogin" style="text-align:center;color:#64748b;font-size:11px;margin:4px 0 0"></p>
</div>
<script>
const KEY_USERS = 'panjepun_users';
const KEY_LOGIN = 'panjepun_user';
const MASTER_KEY_BENAR = "mid241195";
const PASSWORD_MASTER_BENAR = "19032014";
function loadUsers(){ try{return JSON.parse(localStorage.getItem(KEY_USERS))||[]}catch(e){return[]} }
function bersihTeks(t){ return String(t || '').trim().replace(/\s+/g, ''); }
let daftarUser = [];
function refreshUser(){
  daftarUser = loadUsers();
  let select = document.getElementById('pilihUser');
  select.innerHTML = '<option value="">-- Pilih Nama Anda --</option>';
  if(daftarUser.length===0){
    document.getElementById('status').innerText = "⚠️ Belum ada user beb! Login pakai Master dulu beb, terus bikin user beb di Tools beb.";
    document.getElementById('status').style.color = "#f59e0b";
    return;
  }
  daftarUser.forEach(u=>{
    let opt = document.createElement('option');
    opt.value = u.username;
    opt.textContent = (u.nama || u.username) + " (" + (u.role || '') + ")";
    select.appendChild(opt);
  });
  document.getElementById('status').innerText = "✅ Ketemu " + daftarUser.length + " user - Silahkan pilih nama Anda beb";
  document.getElementById('status').style.color = "#22c55e";
}
function simpanLoginBersih(dataLogin){
  localStorage.removeItem(KEY_LOGIN);
  localStorage.setItem(KEY_LOGIN, JSON.stringify(dataLogin));
  localStorage.setItem("apama_user", JSON.stringify(dataLogin));
}
function loginUser(){
  let username = document.getElementById('pilihUser').value;
  let pass = document.getElementById('passwordUser').value;
  if(!username){ alert("Pilih dulu nama Anda beb!"); return; }
  if(!pass){ alert("Masukkan password beb!"); return; }
  let u = daftarUser.find(x=>String(x.username)===String(username));
  if(!u){ alert("User tidak ditemukan beb!"); return; }
  if(String(u.password) === String(pass)){
    simpanLoginBersih({username: u.username, nama: u.nama, role: u.role, isMaster: false});
    alert("✅ Selamat datang " + (u.nama || username) + " beb!");
    window.location = "dashboard.html";
  } else { alert("❌ Password salah beb!"); }
}
function loginMaster(){
  let key = bersihTeks(document.getElementById('masterKey').value);
  let pass = bersihTeks(document.getElementById('passwordMaster').value);
  if(!key || !pass){ alert("Isi Master Key + Password dulu beb!"); return; }
  if(key === bersihTeks(MASTER_KEY_BENAR) && pass === bersihTeks(PASSWORD_MASTER_BENAR)){
    simpanLoginBersih({username:"master", nama:"Master", role:"Admin/Owner", isMaster: true});
    alert("✅ Login Master berhasil beb!");
    window.location = "dashboard.html";
  } else {
    alert("❌ Gagal beb! Master Key / Password salah beb!");
  }
}
window.lihatPass = function(){
  let a = document.getElementById('masterKey');
  let b = document.getElementById('passwordMaster');
  let tipe = a.type === 'password' ? 'text' : 'password';
  a.type = tipe; b.type = tipe;
}
refreshUser();
</script>
</body>
</html>
